name: Android app verification

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, and debug package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: peanut_detection_android
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Run tests, lint, and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test reports and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            peanut_detection_android/app/build/reports/tests/testDebugUnitTest/
            peanut_detection_android/app/build/reports/lint-results-debug.html
            peanut_detection_android/app/build/outputs/apk/debug/app-debug.apk
